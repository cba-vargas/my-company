name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_sqlite, pcntl, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Check PHP formatting
        run: ./vendor/bin/pint --test

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      - name: Run Pest tests
        run: php artisan test

      - name: Validate Docker Compose
        run: docker compose config >/dev/null

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker environment
        run: |
          cp .env.example .env
          sed -i "s/^UID=.*/UID=$(id -u)/" .env
          sed -i "s/^GID=.*/GID=$(id -g)/" .env

      - name: Build and start the complete stack
        run: docker compose up -d --build

      - name: Wait for application health
        run: |
          for attempt in {1..90}; do
            if curl -fsS http://localhost:8080/up >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Show service status
        run: docker compose ps

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
